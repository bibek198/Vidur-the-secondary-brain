# Production stack (EC2). Only Caddy is reachable from outside (80/443); FalkorDB has no published port.
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm app python scripts/bootstrap.py
services:
  falkordb:
    image: falkordb/falkordb:latest
    environment:
      REDIS_ARGS: "--appendonly yes"
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 30000 RESULTSET_SIZE 50000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 60

  app:
    build: .
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      PUBLIC_MODE: "1"
    volumes:
      - repos:/app/data/raw/repos
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  worker-live:
    build: .
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    command: ["python", "-m", "src.realtime.worker", "--graph", "brain_live"]
    volumes:
      - repos:/app/data/raw/repos
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  worker-demo:
    build: .
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    command: ["python", "-m", "src.realtime.worker", "--graph", "brain_demo", "--no-poll", "--no-gitdiff"]
    volumes:
      - repos:/app/data/raw/repos
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  falkordb_data:
  repos:
  caddy_data:
